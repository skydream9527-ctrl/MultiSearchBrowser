# v2.1.0: Web 端 CI — ESLint + 语法检查 + 单元测试
name: Web CI

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
    branches: [main, master]
  pull_request:
    paths:
      - 'web/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (errors block CI)
        run: npx eslint *.js --max-warnings 999

      - name: Check JS syntax
        run: |
          for f in *.js; do
            node --check "$f" || exit 1
          done
          echo "All JS files syntax OK"

      - name: Run Web unit tests
        run: node --test test/

      - name: Check Service Worker cache version
        run: |
          grep -q "CACHE_VERSION" sw.js && echo "SW cache version OK" || (echo "Error: CACHE_VERSION not found" && exit 1)

      - name: Check all modules loaded in index.html
        run: |
          for mod in utils.js constants.js app-store.js app-sync.js i18n.js app-ai.js app-rss.js app-passwords.js app-scripts.js app.js; do
            grep -q "$mod" index.html || (echo "Error: $mod not loaded in index.html" && exit 1)
          done
          echo "All modules loaded in index.html"
