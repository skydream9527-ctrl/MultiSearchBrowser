name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    # v2.0.0: lint 真正卡 PR，不再 continue-on-error
    - name: Run lint
      run: ./gradlew lintDebug

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # v2.0.0 安全加固：Release 签名改用 GitHub secrets 注入的 keystore
    # 配置步骤：
    # 1. 本地生成专用 keystore: keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias msb
    # 2. base64 编码: base64 -i release.jks -o release.b64
    # 3. 在 GitHub repo Settings → Secrets → Actions 中添加：
    #    - SIGNING_KEYSTORE_BASE64  (release.b64 的内容)
    #    - SIGNING_KEY_ALIAS        (msb)
    #    - SIGNING_KEY_PASSWORD     (keystore 密码)
    #    - SIGNING_STORE_PASSWORD   (key 密码)
    # 4. 未配置 secrets 时自动 fallback 到 debug 签名（保证 CI 不中断）
    - name: Decode Release Keystore
      if: github.event_name != 'pull_request' && env.SIGNING_KEYSTORE_BASE64 != ''
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      run: |
        echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks

    - name: Build Release APK (signed)
      if: github.event_name != 'pull_request' && env.SIGNING_KEYSTORE_BASE64 != ''
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      run: ./gradlew assembleRelease
      env:
        MSB_SIGNING_KEYSTORE: ${{ github.workspace }}/release.jks
        MSB_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        MSB_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        MSB_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    - name: Build Release APK (fallback debug signing)
      if: github.event_name != 'pull_request' && env.SIGNING_KEYSTORE_BASE64 == ''
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: app/build/reports/lint-results-*.html

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: ./apk

    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: ./apk

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        files: ./apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
