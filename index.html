<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiSearch Browser 🔎 — 多引擎并行搜索引擎</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .phone-frame {
      width: 375px;
      height: 720px;
      background: #0f172a;
      border: 12px solid #1e293b;
      border-radius: 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .phone-notch {
      width: 140px; height: 24px;
      background: #1e293b;
      border-radius: 0 0 16px 16px;
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
    }
    .notch-camera { width: 8px; height: 8px; background: #090d16; border-radius: 50%; }
    .notch-speaker { width: 40px; height: 4px; background: #090d16; border-radius: 2px; }
    
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 20px; font-size: 11px; color: #94a3b8; font-weight: 600;
    }
    .app-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 18px; font-weight: 800; color: #38bdf8;
      display: flex; align-items: center; justify-content: space-between;
    }
    .app-body {
      flex: 1; padding: 20px; overflow-y: auto; text-align: center;
    }
    .wheel-box { position: relative; width: 220px; height: 220px; margin: 20px auto; }
    .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 10; color: #ef4444; font-size: 20px; }
    .wheel-circle {
      width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(#f59e0b 0 60deg, #38bdf8 60deg 120deg, #10b981 120deg 180deg, #ec4899 180deg 240deg, #818cf8 240deg 300deg, #c084fc 300deg 360deg);
      border: 4px solid #fff; position: relative;
    }
    .wheel-sec { position: absolute; font-size: 11px; font-weight: 700; color: #fff; width: 100%; text-align: center; top: 40%; }
    
    .action-btn {
      background: #38bdf8; color: #0f172a; border: none; font-weight: 800;
      padding: 12px 20px; border-radius: 12px; cursor: pointer; font-size: 14px;
      width: 100%; transition: all 0.2s ease;
    }
    .action-btn:hover { opacity: 0.9; transform: scale(0.98); }
    .result-text { margin-top: 16px; font-weight: 700; color: #38bdf8; font-size: 14px; }
    .home-bar { width: 120px; height: 4px; background: rgba(255, 255, 255, 0.3); border-radius: 2px; margin: 12px auto; }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="phone-notch">
      <div class="notch-camera"></div>
      <div class="notch-speaker"></div>
    </div>
    <div class="status-bar">
      <span>09:50</span>
      <span>📶 5G  🔋 100%</span>
    </div>
    <div class="app-header">
      <span>MultiSearch 浏览器</span>
      <span style="font-size:12px; opacity:0.7;">Android H5 Demo</span>
    </div>
    <div class="app-body">
      
          <div style="display:flex; gap:6px; margin-bottom:14px;">
            <button class="action-btn" id="btnGoogle" style="flex:1; font-size:12px; padding:8px 0;" onclick="switchEngine('google')">Google</button>
            <button class="action-btn" id="btnBing" style="flex:1; font-size:12px; padding:8px 0; background:#1e293b; color:#fff;" onclick="switchEngine('bing')">Bing</button>
            <button class="action-btn" id="btnBaidu" style="flex:1; font-size:12px; padding:8px 0; background:#1e293b; color:#fff;" onclick="switchEngine('baidu')">Baidu</button>
          </div>
          <iframe id="webFrame" src="https://www.google.com/search?igu=1" style="width:100%; height:440px; border-radius:14px; border:1px solid rgba(255,255,255,0.1); background:#fff;"></iframe>
        
    </div>
    <div class="home-bar"></div>
  </div>

  <script>
    
          function switchEngine(eng) {
            const frame = document.getElementById('webFrame');
            ['Google','Bing','Baidu'].forEach(name => {
              const el = document.getElementById('btn'+name);
              if(el) { el.style.background = '#1e293b'; el.style.color = '#fff'; }
            });
            if(eng === 'google') { frame.src = 'https://www.google.com/search?igu=1'; document.getElementById('btnGoogle').style.background = '#38bdf8'; document.getElementById('btnGoogle').style.color = '#0f172a'; }
            else if(eng === 'bing') { frame.src = 'https://www.bing.com'; document.getElementById('btnBing').style.background = '#38bdf8'; document.getElementById('btnBing').style.color = '#0f172a'; }
            else if(eng === 'baidu') { frame.src = 'https://m.baidu.com'; document.getElementById('btnBaidu').style.background = '#38bdf8'; document.getElementById('btnBaidu').style.color = '#0f172a'; }
          }
        
  </script>
</body>
</html>
